name: Unpack NEXORA Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o NEXORA-Firebase-Starter.zip -d /tmp/nexora
          cp -a /tmp/nexora/NEXORA-Firebase-Starter/. .
          rm -f AndroidManifest.xml google-services.json

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NEXORA Android project structure" || true
          git push
