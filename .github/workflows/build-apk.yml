
name: Build NEXORA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
      
        uses: actions/checkout@v4

      - name: Setup Java
      
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
      
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
      
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Gradle Wrapper
      
        run: gradle wrapper --gradle-version 8.9
        
      - name: Create Debug Keystore
      
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build Debug APK
      
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show SHA1
      
        run: |
          ./gradlew :app:signingReport

      - name: Upload APK
      
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-debug-APK
          
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
